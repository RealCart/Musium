name: musium
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.7


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter_native_splash:
  web: false

  color: "#000000"
  color_dark: "#000000"

  image:      assets/icons/splash_screen_icon.png
  image_dark: assets/icons/splash_screen_icon.png

  fullscreen: true

  #! ANDROID 12+ configuration:
  android_12:
    color: "#000000"
    color_dark: "#000000"

    image:      assets/icons/splash_screen_icon.png
    image_dark: assets/icons/splash_screen_icon.png


    icon_background_color: "#000000"
    icon_background_color_dark: "#000000"

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  # fonts:
  #   - family: Schyler
  #     fonts:
