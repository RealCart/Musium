name: musium
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  go_router: ^17.0.1
  shared_preferences: ^2.5.4
  get_it: ^9.2.0
  flutter_svg: ^2.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter_native_splash:
  web: false

  color: "#000000"
  color_dark: "#000000"

  image:      assets/icons/system/splash_screen_icon.png
  image_dark: assets/icons/system/splash_screen_icon.png

  fullscreen: true

  android_12:
    color: "#000000"
    color_dark: "#000000"

    image:      assets/icons/system/splash_screen_icon.png
    image_dark: assets/icons/system/splash_screen_icon.png


    icon_background_color: "#000000"
    icon_background_color_dark: "#000000"

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Mullish
      fonts:
        - asset: assets/fonts/mulish_bold.ttf
          weight: 700
          style: normal
    - family: Century Gothic
      fonts:
        - asset: assets/fonts/century_gothic_bold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/century_gothic.ttf
          weight: 400
          style: normal